name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Test installer bootstrap
        run: bash test/install-smoke.sh
      - name: Test native Auto failover
        run: node --test test/auto-failover.mjs
