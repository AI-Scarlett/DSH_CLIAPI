host: "127.0.0.1"
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: false
  secret-key: "CHANGE_ME_LOCAL_MANAGEMENT_KEY"
  disable-control-panel: true

auth-dir: "/ABSOLUTE/PATH/TO/.dsh/cliproxyapi/auths"

api-keys:
  - "CHANGE_ME_LOCAL_API_KEY"

debug: false
logging-to-file: true
logs-max-total-size-mb: 100
usage-statistics-enabled: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
plugins:
  enabled: false
  dir: "plugins"
